<!DOCTYPE html>
<html>
<head>
    <title>Biography Website</title>
    <!-- Bootstrap CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="biography.css">
    
    <!-- Material Symbols Font & Material Components Library -->
    <link rel="stylesheet" href="https://googleapis.com" />
    <script type="module" src="https://jsdelivr.net"></script>
    
    <style>
        body { padding-top: 70px; }
        .dropdown-menu { padding: 10px; min-width: 200px; }
        .bio-card { margin-bottom: 20px; }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Styles the Material field text to match your dark menu */
        md-outlined-text-field {
            --md-outlined-text-field-container-shape: 4px;
            --md-outlined-text-field-outline-color: #666;
            --md-outlined-text-field-focus-outline-color: #0d6efd;
            --md-outlined-text-field-input-text-color: #fff;
            --md-outlined-text-field-placeholder-text-color: #aaa;
            --md-outlined-text-field-leading-icon-color: #aaa;
            --md-outlined-text-field-focus-leading-icon-color: #0d6efd;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <div class="navbar-brand">Biographies</div>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar">
      
      <div class="offcanvas-header d-flex flex-column align-items-stretch pb-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="offcanvas-title">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <form class="d-flex mb-3" id="searchForm" onsubmit="event.preventDefault();">
          <md-outlined-text-field 
            id="searchInput"
            class="w-100" 
            type="search"
            placeholder="Search names..." 
            aria-label="Search">
            <md-icon slot="leading-icon">search</md-icon>
          </md-outlined-text-field>
        </form>
        <hr class="mt-0 mb-2">
      </div>
      
      <div class="offcanvas-body pt-1">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          
          <li class="nav-item mb-2">
            <a class="nav-link active d-flex align-items-center gap-2" href="index.html">
              <span class="material-symbols-outlined" style="font-size: 24px;">home</span> 
              <span>Home</span>
            </a>
            <hr class="my-2">
          </li>
          
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown">
              <span class="material-symbols-outlined" style="font-size: 24px;">filter_list</span> 
              <span>Filters</span>
            </a>
            
            <ul class="dropdown-menu dropdown-menu-dark mt-2">
                <div class="d-grid gap-2 dropdown-content">
                    <input type="radio" class="btn-check filter-opt" name="gender" id="all" value="all" checked>
                    <label class="btn btn-outline-primary" for="all">Show All</label>

                    <input type="radio" class="btn-check filter-opt" name="gender" id="male" value="male">
                    <label class="btn btn-outline-primary" for="male">(Student) Male</label>

                    <input type="radio" class="btn-check filter-opt" name="gender" id="female" value="female">
                    <label class="btn btn-outline-primary" for="female">(Student) Female</label>
                </div>
            </ul>
          </li>
          
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container">
    <div id="bioContent" class="row"></div>
</main>

<footer class="site-footer mt-5">
    <div class="footer-content">
        <p>&copy; <span id="year"></span> 6D's Biographies. All Rights Reserved.</p>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>
</footer>

<!-- JavaScript Libraries (DO NOT DELETE) -->
<script src="https://jsdelivr.net"></script>
<script src="biography.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
