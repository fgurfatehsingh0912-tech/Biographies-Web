<!DOCTYPE html>
<html>
<head>
    <title>Biography Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="biography.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        body { padding-top: 70px; }
        .dropdown-menu { padding: 10px; min-width: 200px; }
        .bio-card { margin-bottom: 20px; }
        
        /* Ensures the icon and text align seamlessly inside nav links */
        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <div class="navbar-brand">Biographies</div>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar">
      
      <div class="offcanvas-header d-flex flex-column align-items-stretch pb-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="offcanvas-title">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <form class="d-flex mb-3" id="searchForm">
          <input id="searchInput" class="form-control" type="search" placeholder="Search names..." aria-label="Search"/>
        </form>
        <hr class="mt-0 mb-2">
      </div>
      
      <div class="offcanvas-body pt-1">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          
          <li class="nav-item mb-2">
            <a class="nav-link active" href="index.html">
              <span class="material-symbols-outlined" style="font-size: 24px; font-family: 'Material Symbols Outlined' !important;">home</span> 
              <span>Home</span>
            </a>
            <hr class="my-2">
          </li>
          
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
              <span class="material-symbols-outlined" style="font-size: 24px; font-family: 'Material Symbols Outlined' !important;">filter_list</span> 
              <span>Filters</span>
            </a>
            
            <ul class="dropdown-menu dropdown-menu-dark mt-2">
                <div class="d-grid gap-2">
                    <input type="radio" class="btn-check filter-opt" name="gender" id="all" value="all" checked>
                    <label class="btn btn-outline-primary" for="all">Show All</label>

                    <input type="radio" class="btn-check filter-opt" name="gender" id="male" value="male">
                    <label class="btn btn-outline-primary" for="male">(Student) Male</label>

                    <input type="radio" class="btn-check filter-opt" name="gender" id="female" value="female">
                    <label class="btn btn-outline-primary" for="female">(Student) Female</label>
                </div>
            </ul>
            <hr class="my-2">
          </li>
          
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container">
    <div id="bioContent" class="row">
        </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="biography.js"></script>

<footer class="site-footer mt-5">
    <div class="footer-content">
        <p>&copy; <span id="year"></span> 6D's Biographies. All Rights Reserved.</p>

        <script>
          document.getElementById("year").textContent = new Date().getFullYear();
        </script>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>
</footer>
</body>
</html>
